name: DevSecOps Pipeline

on:
  push:
    branches:
      - develop
      - stage
      - production

  pull_request:
    branches:
      - develop
      - stage
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          mkdir -p build-report
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > build-report/requirements-installed.txt

      - name: Validate Python syntax
        run: |
          echo "=== Build Report ===" > build-report/build-report.txt
          echo "Data: $(date)" >> build-report/build-report.txt
          echo "" >> build-report/build-report.txt

          echo "Versao do Python:" >> build-report/build-report.txt
          python --version >> build-report/build-report.txt 2>&1
          echo "" >> build-report/build-report.txt

          echo "Validacao de sintaxe:" >> build-report/build-report.txt
          python -m py_compile run.py
          echo "run.py validado com sucesso" >> build-report/build-report.txt
          echo "" >> build-report/build-report.txt

          echo "Arquivos principais encontrados:" >> build-report/build-report.txt
          ls -la >> build-report/build-report.txt
          echo "" >> build-report/build-report.txt

          echo "Arquivos da aplicacao:" >> build-report/build-report.txt
          find todo_project -type f | sort >> build-report/build-report.txt

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report

  bandit:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          mkdir -p bandit-report

          bandit -r todo_project || true

          bandit -r todo_project \
            -f html \
            -o bandit-report/bandit-report.html || true

          bandit -r todo_project \
            -f txt \
            -o bandit-report/bandit-report.txt || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report

  docker:
    runs-on: ubuntu-latest
    needs: bandit

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          mkdir -p docker-report

          echo "=== Docker Build Report ===" > docker-report/docker-report.txt
          echo "Data: $(date)" >> docker-report/docker-report.txt
          echo "" >> docker-report/docker-report.txt

          docker build -t task-manager-devsecops . \
            | tee docker-report/docker-build.log

          echo "" >> docker-report/docker-report.txt
          echo "Imagem Docker criada:" >> docker-report/docker-report.txt
          docker images task-manager-devsecops \
            | tee docker-report/docker-image.txt >> docker-report/docker-report.txt

          echo "" >> docker-report/docker-report.txt
          echo "Historico de camadas da imagem:" >> docker-report/docker-report.txt
          docker history task-manager-devsecops \
            | tee docker-report/docker-history.txt >> docker-report/docker-report.txt

          docker inspect task-manager-devsecops \
            > docker-report/docker-inspect.json

      - name: Upload Docker Report
        uses: actions/upload-artifact@v4
        with:
          name: docker-report
          path: docker-report

  dependency-check:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "TaskManager"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  review:
    runs-on: ubuntu-latest
    needs: dependency-check

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Create temporary review environment
        run: |
          mkdir -p review-report
          echo "=== Review Environment Report ===" > review-report/review.txt
          echo "Data: $(date)" >> review-report/review.txt
          echo "Ambiente temporario criado para avaliacao manual" >> review-report/review.txt
          echo "Branch: ${{ github.head_ref }}" >> review-report/review.txt
          echo "Pull Request: ${{ github.event.pull_request.number }}" >> review-report/review.txt

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: review-report

  deploy-stage:
    runs-on: ubuntu-latest
    needs: dependency-check

    if: github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Stage
        run: |
          mkdir -p stage-report

          echo "=== Stage Deploy Report ===" > stage-report/stage-report.txt
          echo "Data: $(date)" >> stage-report/stage-report.txt
          echo "Branch: ${{ github.ref }}" >> stage-report/stage-report.txt
          echo "" >> stage-report/stage-report.txt

          echo "Deploy Stage iniciado" >> stage-report/stage-report.txt

          docker build -t task-manager-stage . \
            | tee stage-report/stage-docker-build.log

          echo "" >> stage-report/stage-report.txt
          echo "Imagem Stage criada:" >> stage-report/stage-report.txt
          docker images task-manager-stage \
            | tee stage-report/stage-docker-image.txt >> stage-report/stage-report.txt

          echo "" >> stage-report/stage-report.txt
          echo "Deploy concluido com sucesso" >> stage-report/stage-report.txt

      - name: Upload Stage Report
        uses: actions/upload-artifact@v4
        with:
          name: stage-report
          path: stage-report

  dast-stage:
    runs-on: ubuntu-latest
    needs: deploy-stage

    if: github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Start application for DAST
        run: |
          docker build -t task-manager-stage .
          docker run -d -p 5000:5000 --name taskmanager-stage task-manager-stage
          sleep 10
          docker ps

      - name: Prepare ZAP report directory
        run: |
          mkdir -p zap-report
          chmod -R 777 zap-report

      - name: OWASP ZAP DAST
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/zap-report:/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -r /zap/wrk/zap-stage-report.html \
            -I

      - name: List ZAP report files
        run: |
          echo "Arquivos gerados pelo ZAP:"
          find zap-report -type f
          ls -la zap-report

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-stage-report
          path: zap-report