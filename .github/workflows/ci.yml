name: DevSecOps Pipeline

on:
  push:
    branches:
      - develop
      - stage
      - production

  pull_request:
    branches:
      - develop
      - stage
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r todo_project/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile todo_project/run.py

  bandit:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r todo_project

  docker:
    runs-on: ubuntu-latest
    needs: bandit

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t task-manager-devsecops ./todo_project

  dependency-check:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "TaskManager"
          path: "./todo_project"
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  review:
    runs-on: ubuntu-latest
    needs: dependency-check

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Create temporary review environment
        run: |
          echo "Ambiente temporario de review criado para avaliacao manual"
          echo "Branch: ${{ github.head_ref }}"
          echo "Pull Request: ${{ github.event.pull_request.number }}"

  deploy-stage:
    runs-on: ubuntu-latest
    needs: dependency-check

    if: github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Stage
        run: |
          echo "Deploy em ambiente de Stage iniciado"
          docker build -t task-manager-stage ./todo_project
          echo "Aplicacao implantada em Stage para simulacao de producao"

  dast-stage:
    runs-on: ubuntu-latest
    needs: deploy-stage

    if: github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Start application for DAST
        run: |
          docker build -t task-manager-stage ./todo_project
          docker run -d -p 5000:5000 --name taskmanager-stage task-manager-stage
          sleep 10
          docker ps

      - name: OWASP ZAP DAST
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/zap-report:/zap/wrk \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -r zap-stage-report.html \
            -I

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-stage-report
          path: zap-report