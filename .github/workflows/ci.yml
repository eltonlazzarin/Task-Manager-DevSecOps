name: DevSecOps Pipeline

on:
  push:
    branches:
      - develop
      - stage
      - production

  pull_request:
    branches:
      - develop
      - stage
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r todo_project/requirements.txt

      - name: Validate Python syntax
        run: |
          mkdir -p build-report
          python -m py_compile todo_project/run.py
          echo "Build executado com sucesso" > build-report/build.txt

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report

  bandit:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          mkdir -p bandit-report
          bandit -r todo_project -f html -o bandit-report/bandit.html || true
          bandit -r todo_project -f txt -o bandit-report/bandit.txt || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report

  docker:
    runs-on: ubuntu-latest
    needs: bandit

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          mkdir -p docker-report
          docker build -t task-manager-devsecops ./todo_project | tee docker-report/docker-build.log
          docker images task-manager-devsecops > docker-report/docker-image.txt

      - name: Upload Docker Report
        uses: actions/upload-artifact@v4
        with:
          name: docker-report
          path: docker-report

  dependency-check:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "TaskManager"
          path: "./todo_project"
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  review:
    runs-on: ubuntu-latest
    needs: dependency-check

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Create temporary review environment
        run: |
          mkdir -p review-report
          echo "Ambiente temporario criado" > review-report/review.txt
          echo "Branch: ${{ github.head_ref }}" >> review-report/review.txt
          echo "Pull Request: ${{ github.event.pull_request.number }}" >> review-report/review.txt

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: review-report

  deploy-stage:
    runs-on: ubuntu-latest
    needs: dependency-check

    if: github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Stage
        run: |
          mkdir -p stage-report
          echo "Deploy Stage iniciado" > stage-report/stage.txt
          docker build -t task-manager-stage ./todo_project | tee stage-report/docker-build.log
          echo "Deploy concluido" >> stage-report/stage.txt

      - name: Upload Stage Report
        uses: actions/upload-artifact@v4
        with:
          name: stage-report
          path: stage-report

  dast-stage:
    runs-on: ubuntu-latest
    needs: deploy-stage

    if: github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Start application for DAST
        run: |
          docker build -t task-manager-stage ./todo_project
          docker run -d -p 5000:5000 --name taskmanager-stage task-manager-stage
          sleep 10
          docker ps

      - name: Prepare ZAP report directory
        run: |
          mkdir -p zap-report
          chmod -R 777 zap-report

      - name: OWASP ZAP DAST
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/zap-report:/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -r zap-stage-report.html \
            -I

      - name: List ZAP report files
        run: |
          ls -la zap-report

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-stage-report
          path: zap-report